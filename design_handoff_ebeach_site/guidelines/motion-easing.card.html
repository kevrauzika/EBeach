<!-- @dsCard group="Motion" viewport="700x180" name="Curvas" subtitle="Tide, swell, drift — long and calm" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-raised);font-family:var(--font-body);padding:22px 26px;display:flex;align-items:center}body{display:block}</style></head><body>
<div style="display:grid;gap:12px">
<div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-bottom:5px">--ease-tide · cubic-bezier(0.22,1,0.36,1)</div><div style="position:relative;height:14px;background:var(--sand-200);border-radius:999px;overflow:hidden"><div style="position:absolute;top:0;left:0;height:100%;width:24px;border-radius:999px;background:var(--sun-500);animation:run 2.6s cubic-bezier(0.22,1,0.36,1) infinite alternate;animation-delay:0s"></div></div></div><div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-bottom:5px">--ease-swell · cubic-bezier(0.65,0,0.35,1)</div><div style="position:relative;height:14px;background:var(--sand-200);border-radius:999px;overflow:hidden"><div style="position:absolute;top:0;left:0;height:100%;width:24px;border-radius:999px;background:var(--sun-500);animation:run 2.6s cubic-bezier(0.65,0,0.35,1) infinite alternate;animation-delay:0.12s"></div></div></div><div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-bottom:5px">--ease-drift · cubic-bezier(0.16,1,0.3,1)</div><div style="position:relative;height:14px;background:var(--sand-200);border-radius:999px;overflow:hidden"><div style="position:absolute;top:0;left:0;height:100%;width:24px;border-radius:999px;background:var(--sun-500);animation:run 2.6s cubic-bezier(0.16,1,0.3,1) infinite alternate;animation-delay:0.24s"></div></div></div>
</div><style>@keyframes run{to{transform:translateX(620px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></body></html>
