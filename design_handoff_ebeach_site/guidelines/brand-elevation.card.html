<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface-raised);font-family:var(--font-body);padding:22px 26px;display:flex;align-items:center}</style></head><body><div style="display:flex;gap:20px;width:100%">
<div style="flex:1;height:110px;border-radius:14px;background:var(--surface-raised);border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:12px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">--hairline (padrão)</div>
<div style="flex:1;height:110px;border-radius:14px;background:var(--surface-raised);box-shadow:var(--shadow-lift);display:flex;align-items:flex-end;padding:12px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">--shadow-lift</div>
<div style="flex:1;height:110px;border-radius:14px;background:var(--surface-raised);box-shadow:var(--shadow-float);display:flex;align-items:flex-end;padding:12px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">--shadow-float</div>
</div></body></html>
